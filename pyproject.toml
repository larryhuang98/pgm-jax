[project]
name = "pgm-jax"
version = "0.1.0"
description = "The polarizable Gaussian multipole (pGM) model in JAX, validated against Amber"
requires-python = ">=3.10"
dependencies = ["jax", "numpy", "scipy"]

[project.optional-dependencies]
graph = ["networkx"]          # param.map_atoms / bond_graph
md = ["jax-md>=0.2.29"]       # pgm_jax.md (only its simulation core is imported)
test = ["pytest", "networkx"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["pgm_jax"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--strict-markers"
# tests/README.md: `pytest -m "not slow"` is the fast suite; the other markers label tests that
# are skipped when their data, program or package is missing (they never fail for that reason)
markers = [
    "slow: takes more than about 20 s on 32 CPU cores (deselect with -m 'not slow': ~30 instead of ~70 min)",
    "gpu: needs a JAX GPU backend; skipped without one (tests/conftest.py); no test needs one at present",
    "needs_data: needs data files outside the repository (pGM3P-25 box, Amber test inputs, data/qm); skipped without them",
    "needs_external: needs an external program (pmemd.pgm, i-PI, OpenMM >= 8.4); skipped without it",
    "optional_deps: needs an optional Python package (rdkit, ase, networkx); skipped without it",
    "regression: the golden-output harness of tests/regression (opt-in, PGM_REGRESSION=1)",
]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["paper", "runs", ".tools"]

[tool.ruff.lint]
# docs/api_design.md, decision D11: pycodestyle, pyflakes, isort, pyupgrade, bugbear (subset).
# pydocstyle (D, numpy convention below) is enabled in report-only mode until the docstring phases
# (P8, P9) are done: ruff-docstrings.toml extends this file with D, run it with --exit-zero:
#     ruff check --config ruff-docstrings.toml --exit-zero --statistics
# (scripts/dev/check_docstrings.py lists the missing docstrings, private and nested ones included).
# After P8/P9, "D" moves into `select` here and the report-only file is removed.
select = ["E", "W", "F", "I", "UP", "B"]
# E741: l / I / O are physics notation (angular index, identity); B905: zip(strict=) not wanted;
# B008: defaults are frozen dataclasses (MDSettings()); B023: flagged closures are jitted and
# called within the same loop iteration
ignore = ["E741", "B905", "B008", "B023"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.isort]
known-first-party = ["pgm_jax"]

[tool.ruff.format]
quote-style = "double"
