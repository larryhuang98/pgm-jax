[project]
name = "pgm-jax"
version = "0.1.0"
description = "The polarizable Gaussian multipole (pGM) model in JAX, validated against Amber"
requires-python = ">=3.10"
dependencies = ["jax", "numpy", "scipy"]

[project.optional-dependencies]
graph = ["networkx"]          # param.map_atoms / bond_graph
md = ["jax-md>=0.2.29"]       # pgm_jax.md (only its simulation core is imported)
test = ["pytest", "networkx"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["pgm_jax"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["paper", "runs", ".tools"]

[tool.ruff.lint]
# pyflakes, isort, pyupgrade (docs/api_design.md, "Style and tooling")
select = ["F", "I", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["pgm_jax"]

[tool.ruff.format]
quote-style = "double"
